name: keyloop-service-scheduler
services:
  redis:
    image: redis:7.4.12-alpine
    ports:
      - '127.0.0.1:56379:6379'
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
  redis-test:
    image: redis:7.4.12-alpine
    profiles: ['test']
    ports:
      - '127.0.0.1:56380:6379'
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - scheduler_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 15
  # Disposable test infrastructure, separate from the development database/volume.
  postgres-test:
    image: postgres:17.6-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: scheduler_test
      POSTGRES_PASSWORD: local_scheduler_test_password
      POSTGRES_DB: service_scheduler_test
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scheduler_test -d service_scheduler_test']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  scheduler_postgres_data:
